[project]
name = "openmon"
version = "0.6.2"
description = "Plataforma multi-tenant de monitoramento de datacenter (VMware, Hyper-V, Veeam, SNMP)"
requires-python = ">=3.11"
# Em produção as dependências vêm do apt do Debian 13 (packaging/apt/vm1-frontend.txt).
dependencies = [
    "paramiko>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "psycopg[binary]>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/e2e"
