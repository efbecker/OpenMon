# /etc/apache2/sites-available/openmon.conf
# Ativação:
#   a2enmod ssl headers proxy proxy_http proxy_wstunnel rewrite http2
#   a2enconf openmon-security
#   a2dissite 000-default && a2ensite openmon && apachectl configtest && systemctl reload apache2
#
# A API roda em /run/openmon/api.sock (systemd: openmon-api.service). Nenhuma
# porta da aplicação fica exposta na rede: o Apache é o único ponto de entrada.

# O instalador (scripts/install.sh) troca pelo FQDN da VM 1
Define OPENMON_FQDN openmon.example.local

<VirtualHost *:80>
    ServerName ${OPENMON_FQDN}
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName ${OPENMON_FQDN}
    Protocols h2 http/1.1

    SSLEngine on
    # Troque pelo certificado da empresa (ou Let's Encrypt via python3-certbot-apache)
    SSLCertificateFile    /etc/ssl/certs/openmon.crt
    SSLCertificateKeyFile /etc/ssl/private/openmon.key

    # Somente arquivos estáticos do frontend (build do SPA). Nada de segredo aqui.
    DocumentRoot /var/www/openmon/public
    <Directory /var/www/openmon/public>
        Options -Indexes -FollowSymLinks -ExecCGI
        AllowOverride None
        Require all granted
        # Rotas do SPA caem no index.html
        FallbackResource /index.html
    </Directory>

    # Assets com hash no nome podem ficar em cache longo
    <LocationMatch "^/assets/.+\.[0-9a-zA-Z_-]{8,}\.(js|css|woff2|svg|png)$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header always set Cache-Control "no-store"
    </Files>

    # API e WebSocket (logs do deploy, dashboards em tempo real)
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset X-Forwarded-For early
    ProxyPass        /api/ws/ "unix:/run/openmon/api.sock|ws://localhost/api/ws/"
    ProxyPass        /api/    "unix:/run/openmon/api.sock|http://localhost/api/"
    ProxyPassReverse /api/    "http://localhost/api/"

    <Location /api/>
        # Respostas da API nunca em cache
        Header always set Cache-Control "no-store"
        LimitRequestBody 10485760
    </Location>
    # Upload de pacote de backup para restauração
    <Location /api/system/backups/upload>
        LimitRequestBody 21474836480
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/openmon_error.log
    CustomLog ${APACHE_LOG_DIR}/openmon_access.log combined
</VirtualHost>
