# /etc/fail2ban/jail.d/openmon.conf
[openmon-auth]
enabled   = true
filter    = openmon-auth
logpath   = /var/log/openmon/auth.log
backend   = auto
port      = http,https
banaction = nftables[type=multiport]
maxretry  = 10
findtime  = 10m
bantime   = 1h
# Reincidentes: banimento progressivo
bantime.increment = true
bantime.maxtime   = 1w
