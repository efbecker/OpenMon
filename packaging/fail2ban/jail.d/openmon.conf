# /etc/fail2ban/jail.d/openmon.conf
[openmon-auth]
enabled   = true
filter    = openmon-auth
logpath   = /var/log/openmon/auth.log
backend   = auto
port      = http,https
banaction = nftables[type=multiport]
maxretry  = 10
findtime  = 10m
bantime   = 1h
# Reincidentes: banimento progressivo
bantime.increment = true
bantime.maxtime   = 1w

# Bloqueios manuais feitos pela tela Segurança (permanentes até desbloquear).
# A lista oficial fica em /var/lib/openmon/fail2ban/manual.json e é reaplicada
# a cada minuto pelo openmon-fail2ban.timer, então sobrevive a reinícios.
[openmon-manual]
enabled   = true
filter    = openmon-manual
logpath   = /var/log/openmon/auth.log
backend   = auto
port      = http,https
banaction = nftables[type=multiport]
maxretry  = 1
bantime   = -1
