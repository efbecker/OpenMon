# /etc/fail2ban/filter.d/openmon-auth.conf
# Lê /var/log/openmon/auth.log (uma linha JSON por evento), por exemplo:
# {"ts":"2026-11-09T19:30:00Z","event":"auth.failure","ip":"203.0.113.7","username":"admin","source":"local","reason":"bad_password"}
[Definition]
failregex = ^\{"ts":"[^"]+","event":"auth\.(?:failure|locked|rate_limited)","ip":"<HOST>"
ignoreregex =
datepattern = ^\{"ts":"%%Y-%%m-%%dT%%H:%%M:%%S
