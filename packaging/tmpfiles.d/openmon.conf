# /etc/tmpfiles.d/openmon.conf
# Socket da API (Apache acessa pelo grupo www-data; o setgid mantém o grupo)
d /run/openmon          2750 openmon www-data -
d /var/lib/openmon      0750 openmon openmon  -
d /var/lib/openmon/reports 0750 openmon openmon -
d /var/lib/openmon/spool   0750 openmon openmon -
d /var/log/openmon      0750 openmon adm      -
d /var/backups/openmon  0700 openmon openmon  -
# Fail2ban: estado publicado pelo root (a API só lê) e fila de pedidos da API
d /var/lib/openmon/fail2ban          0750 root    openmon -
d /var/lib/openmon/fail2ban-requests 0700 openmon openmon -
